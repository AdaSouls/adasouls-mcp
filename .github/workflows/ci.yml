name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Only the mocked tool-level suite runs here -- the Treasury-Agent-
      # via-MCP suite skips itself unless ADASOULS_API_URL + fixture env
      # vars are set, which needs a real running adasouls-api. No
      # deployed dev environment exists yet (Phase 0's ECS pipeline is
      # still deferred).
      - run: npm test
