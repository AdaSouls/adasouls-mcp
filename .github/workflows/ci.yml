name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # @adasouls/sdk isn't published yet -- package.json depends on it
      # via a sibling-checkout file: path (see README.md's "Known gaps"),
      # matching reference-agents/treasury-agent's same situation.
      - name: Checkout adasouls-sdk-typescript
        uses: actions/checkout@v4
        with:
          repository: AdaSouls/adasouls-sdk-typescript
          path: ../adasouls-sdk-typescript
      - name: Build the SDK dependency
        working-directory: ../adasouls-sdk-typescript
        run: npm ci && npm run build
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # Only the mocked tool-level suite runs here -- the Treasury-Agent-
      # via-MCP suite skips itself unless ADASOULS_API_URL + fixture env
      # vars are set, which needs a real running adasouls-api. No
      # deployed dev environment exists yet (Phase 0's ECS pipeline is
      # still deferred).
      - run: npm test
